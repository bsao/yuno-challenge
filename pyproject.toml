[project]
name = "tiendamax-payment-intelligence"
version = "0.1.0"
description = "Payment analytics prototype for TiendaMax built on Yuno transaction webhooks."
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["analytics", "app", "data_gen", "pipeline"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["data_gen", "pipeline", "analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
